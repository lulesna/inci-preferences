{% extends "base.html" %}

{% block title %}Find Similar Products{% endblock %}

{% block content %}
<section class="main-section">
    <div style="max-width: 1200px; margin: 0 auto;">
        <h2>Find Similar Products</h2>
        
        <div id="original-product" style="margin-bottom: 40px;">
            <p>Loading...</p>
        </div>
        
        <div id="dupes-results"></div>
    </div>
</section>

<script>
function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    const div = document.createElement('div');
    div.textContent = String(text);
    return div.innerHTML;
}

const rawCosmeticId = new URLSearchParams(window.location.search).get('id');
const cosmeticId = /^\d+$/.test(rawCosmeticId) ? rawCosmeticId : null;

function formatCategory(text) {
    if (!text) return '';
    return text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
}

async function loadDupes() {
    try {
        const response = await fetch(`/api/cosmetics/${encodeURIComponent(cosmeticId)}/find_dupes/`);
        const data = await response.json();

        const original = data.original;
        const originalIngredientsCount = Array.isArray(original.ingredients) ? original.ingredients.length : 0;

        const originalContainer = document.getElementById('original-product');
        originalContainer.innerHTML = `
            <div class="cosmetic-detail-header">
                <h3>${escapeHtml(original.name)}</h3>
                <p><strong>Brand:</strong> ${escapeHtml(original.brand)}</p>
                <p><strong>Ingredients:</strong> ${originalIngredientsCount}</p>
            </div>
        `;

        const container = document.getElementById('dupes-results');

        if (data.dupes.length === 0) {
            container.innerHTML = '';
            const p = document.createElement('p');
            p.style.textAlign = 'center';
            p.style.color = 'var(--text)';
            p.textContent = 'No similar products found.';
            container.appendChild(p);
            return;
        }

        let html = `<h3 style="color: var(--lime); margin-bottom: 20px;">Found ${data.dupes.length} Similar Products</h3><div class="cosmetics-grid">`;

        data.dupes.forEach(dupe => {
            const escapedName = escapeHtml(dupe.name);
            const escapedBrand = escapeHtml(dupe.brand);
            const displayType = escapeHtml(formatCategory(dupe.product_type || dupe.subcategory || ''));

            const dupeId = typeof dupe.id === 'number' ? dupe.id : 0;
            const similarityScore = typeof dupe.similarity_score === 'number' ? dupe.similarity_score : 0;
            const matchingCount = typeof dupe.matching_ingredients_count === 'number' ? dupe.matching_ingredients_count : 0;

            html += `
                <div class="cosmetic-result-card safe">
                    <div class="similarity-badge" style="
                        position: absolute;
                        top: 12px;
                        right: 12px;
                        background: var(--lime);
                        color: white;
                        padding: 6px 12px;
                        border-radius: 50px;
                        font-size: 12px;
                        font-weight: 700;
                    ">
                        ${similarityScore}% match
                    </div>
                    <div class="card-content">
                        <h3 style="padding-right: 90px;">${escapedName}</h3>
                        <p><strong>Brand:</strong> ${escapedBrand}</p>
                        ${displayType ? `<p><strong>Type:</strong> ${displayType}</p>` : ''}
                        <p><strong>Matching:</strong> ${matchingCount}/${originalIngredientsCount}</p>
                    </div>
                    <a href="/cosmetic/${dupeId}/">View Details</a>
                </div>
            `;
        });

        html += '</div>';
        container.innerHTML = html;

    } catch (error) {
        const container = document.getElementById('dupes-results');
        container.innerHTML = '';
        const p = document.createElement('p');
        p.textContent = 'Error loading dupes.';
        container.appendChild(p);
    }
}

if (cosmeticId) {
    loadDupes();
} else {
    const container = document.getElementById('original-product');
    container.innerHTML = '';
    const p = document.createElement('p');
    p.textContent = 'Invalid product ID.';
    container.appendChild(p);
}
</script>
{% endblock %}
