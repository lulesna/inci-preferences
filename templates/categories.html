{% extends "base.html" %}
{% load static %}

{% block title %}Categories INCI Preferences{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/categories.css' %}">
{% endblock %}

{% block content %}
    <section class="main-section">
        <h2>Categories</h2>

        <div class="categories-container">
            <a href="{% url 'skincare' %}" class="category-card">
                <img src="{% static 'images/category-skincare.jpg' %}" alt="Category 1">
                <p>Skincare</p>
            </a>

            <a href="{% url 'makeup' %}" class="category-card">
                <img src="{% static 'images/category-makeup.jpg' %}" alt="Category 2">
                <p>Makeup</p>
            </a>

            <a href="{% url 'bodycare' %}" class="category-card">
                <img src="{% static 'images/category-bodycare.jpg' %}" alt="Category 3">
                <p>Bodycare</p>
            </a>
        </div>
    </section>
{% endblock %}
