{% extends 'base.html' %}
{% load static %}

{% block title %}Rejestracja{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-form">
        <h2>Zarejestruj się</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary">Zarejestruj</button>
        </form>

        <p class="auth-link">
            Masz już konto? <a href="{% url 'users:login' %}">Zaloguj się tutaj</a>
        </p>
    </div>
</div>
{% endblock %}
