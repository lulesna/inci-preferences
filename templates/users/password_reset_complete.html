{% extends 'base.html' %}
{% load static %}

{% block title %}Password changed - INCI Preferences{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/forms.css' %}">
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-form">
        <h2>Password changed</h2>

        <p class="auth-intro">
            Your new password is active. You can use it to log in right away.
        </p>

        <p class="auth-link">
            <a href="{% url 'users:login' %}">Go to log in</a>
        </p>
    </div>
</div>
{% endblock %}
