{% extends 'base.html' %}
{% load static %}

{% block title %}Login INCI Preferences{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-form">
        <h2>Zaloguj się</h2>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" name="username" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" name="password" id="password" required>
            </div>
            <button type="submit" class="btn-primary">Zaloguj</button>
        </form>

        <p class="auth-link">
            You don't have an account yet? <a href="{% url 'users:register' %}">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
