{% extends "base.html" %}

{% block title %}Cosmetic Details - INCI Preferences{% endblock %}

{% block content %}
    <section class="main-section">
        <div class="cosmetic-detail-container" id="cosmetic-details">
            <p>Loading cosmetic details...</p>
        </div>
    </section>

    {% if user.is_authenticated %}
    <div id="ingredient-modal" style="display: none;">
        <div class="modal-overlay" onclick="closeIngredientModal()"></div>
        <div class="modal-content">
            <h3 id="modal-ingredient-name"></h3>
            <p style="color: var(--text); margin-bottom: 20px;">Set your preference for this ingredient:</p>

            <div class="preference-buttons">
                <button class="preference-btn safe" onclick="setIngredientPreference('GREEN')">
                    ✅ Safe
                </button>
                <button class="preference-btn moderate" onclick="setIngredientPreference('YELLOW')">
                    ⚠️ Moderate
                </button>
                <button class="preference-btn unsafe" onclick="setIngredientPreference('RED')">
                    🚫 Unsafe
                </button>
            </div>

            <button class="cancel-btn" onclick="closeIngredientModal()">Cancel</button>
        </div>
    </div>
    {% endif %}

    <script>
    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }

    const rawId = window.location.pathname.split('/').filter(Boolean).pop();
    const cosmeticId = /^\d+$/.test(rawId) ? rawId : null;
    let userPreferences = null;
    let selectedIngredient = null;

    async function loadUserPreferences() {
        {% if user.is_authenticated %}
        try {
            const response = await fetch('/api/preferences/my_preferences/');
            const data = await response.json();
            userPreferences = {
                safe: data.safe_ingredients.map(ing => ing.id),
                moderate: data.moderate_ingredients.map(ing => ing.id),
                unsafe: data.unsafe_ingredients.map(ing => ing.id)
            };
        } catch (error) {
            userPreferences = null;
        }
        {% endif %}
    }

    function getIngredientColor(ingredientId) {
        if (!userPreferences) return 'none';

        if (userPreferences.safe.includes(ingredientId)) return 'safe';
        if (userPreferences.moderate.includes(ingredientId)) return 'moderate';
        if (userPreferences.unsafe.includes(ingredientId)) return 'unsafe';
        return 'none';
    }

    function formatCategory(text) {
        if (!text) return '';
        return text.charAt(0) + text.slice(1).toLowerCase();
    }

    {% if user.is_authenticated %}
    function openIngredientModal(ingredientId, ingredientName) {
        selectedIngredient = ingredientId;
        document.getElementById('modal-ingredient-name').textContent = ingredientName;
        document.getElementById('ingredient-modal').style.display = 'block';
    }

    function closeIngredientModal() {
        document.getElementById('ingredient-modal').style.display = 'none';
        selectedIngredient = null;
    }

    async function setIngredientPreference(color) {
        if (!selectedIngredient) return;

        try {
            const response = await fetch('/api/preferences/set_ingredient_color/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    ingredient_id: selectedIngredient,
                    color: color
                })
            });

            if (response.ok) {
                closeIngredientModal();
                await loadUserPreferences();
                await loadCosmeticDetails();
            } else {
                alert('Error setting preference');
            }
        } catch (error) {
            alert('Error setting preference');
        }
    }
    {% endif %}

    async function loadCosmeticDetails() {
        await loadUserPreferences();

        try {
            const response = await fetch(`/api/cosmetics/${encodeURIComponent(cosmeticId)}/`);
            const cosmetic = await response.json();

            const container = document.getElementById('cosmetic-details');
            container.innerHTML = '';

            const header = document.createElement('div');
            header.className = 'cosmetic-detail-header';

            const h2 = document.createElement('h2');
            h2.textContent = cosmetic.name;
            header.appendChild(h2);

            {% if user.is_authenticated %}
            const favBtn = document.createElement('button');
            favBtn.id = 'favorite-btn';
            favBtn.onclick = toggleFavorite;
            favBtn.title = 'Add to favorites';
            favBtn.textContent = '☆';
            header.appendChild(favBtn);
            {% endif %}

            const brandP = document.createElement('p');
            const brandStrong = document.createElement('strong');
            brandStrong.textContent = 'Brand:';
            brandP.appendChild(brandStrong);
            brandP.appendChild(document.createTextNode(' ' + cosmetic.brand));
            header.appendChild(brandP);

            const categoryP = document.createElement('p');
            const categoryStrong = document.createElement('strong');
            categoryStrong.textContent = 'Category:';
            categoryP.appendChild(categoryStrong);
            categoryP.appendChild(document.createTextNode(' ' + formatCategory(cosmetic.main_category)));
            header.appendChild(categoryP);

            if (cosmetic.subcategory) {
                const subP = document.createElement('p');
                const subStrong = document.createElement('strong');
                subStrong.textContent = 'Subcategory:';
                subP.appendChild(subStrong);
                subP.appendChild(document.createTextNode(' ' + formatCategory(cosmetic.subcategory)));
                header.appendChild(subP);
            }

            if (cosmetic.product_type) {
                const typeP = document.createElement('p');
                const typeStrong = document.createElement('strong');
                typeStrong.textContent = 'Product Type:';
                typeP.appendChild(typeStrong);
                typeP.appendChild(document.createTextNode(' ' + formatCategory(cosmetic.product_type)));
                header.appendChild(typeP);
            }

            container.appendChild(header);

            const ingredientsSection = document.createElement('div');
            ingredientsSection.className = 'ingredients-section';

            const ingredientsCount = Array.isArray(cosmetic.ingredients) ? cosmetic.ingredients.length : 0;

            const h3 = document.createElement('h3');
            h3.textContent = `Full Ingredients List (${ingredientsCount})`;
            ingredientsSection.appendChild(h3);

            if (ingredientsCount > 0) {
                const list = document.createElement('div');
                list.className = 'ingredients-list';

                cosmetic.ingredients.forEach((ing, index) => {
                    const color = getIngredientColor(ing.id);
                    const ingredientId = typeof ing.id === 'number' ? ing.id : 0;

                    const span = document.createElement('span');
                    span.className = `ingredient-tag ${color}`;
                    span.textContent = ing.inci_name;

                    {% if user.is_authenticated %}
                    span.classList.add('clickable');
                    span.title = 'Click to set preference';
                    span.onclick = () => openIngredientModal(ingredientId, ing.inci_name);
                    {% else %}
                    span.title = ing.purpose || 'No purpose listed';
                    {% endif %}

                    list.appendChild(span);

                    if (index < cosmetic.ingredients.length - 1) {
                        list.appendChild(document.createTextNode(' '));
                    }
                });

                ingredientsSection.appendChild(list);

                {% if user.is_authenticated %}
                if (userPreferences) {
                    const legend = document.createElement('div');
                    legend.className = 'ingredient-legend';

                    const safeSpan = document.createElement('span');
                    safeSpan.className = 'ingredient-tag safe';
                    safeSpan.textContent = '✅ Safe';
                    legend.appendChild(safeSpan);

                    const moderateSpan = document.createElement('span');
                    moderateSpan.className = 'ingredient-tag moderate';
                    moderateSpan.textContent = '⚠️ Moderate';
                    legend.appendChild(moderateSpan);

                    const unsafeSpan = document.createElement('span');
                    unsafeSpan.className = 'ingredient-tag unsafe';
                    unsafeSpan.textContent = '🚫 Unsafe';
                    legend.appendChild(unsafeSpan);

                    const legendText = document.createElement('span');
                    legendText.style.color = 'var(--text)';
                    legendText.style.fontSize = '12px';
                    legendText.textContent = 'based on your preferences - click ingredient to change';
                    legend.appendChild(legendText);

                    ingredientsSection.appendChild(legend);
                }
                {% endif %}
            } else {
                const p = document.createElement('p');
                p.textContent = 'No ingredients listed.';
                ingredientsSection.appendChild(p);
            }

            container.appendChild(ingredientsSection);

            const cosmeticIdForLink = typeof cosmetic.id === 'number' ? cosmetic.id : 0;
            const dupesDiv = document.createElement('div');
            dupesDiv.style.textAlign = 'center';
            dupesDiv.style.marginTop = '30px';

            const dupesLink = document.createElement('a');
            dupesLink.href = `/dupes/?id=${cosmeticIdForLink}`;
            dupesLink.style.display = 'inline-block';
            dupesLink.style.padding = '12px 24px';
            dupesLink.style.backgroundColor = 'var(--main-pink)';
            dupesLink.style.color = 'white';
            dupesLink.style.textDecoration = 'none';
            dupesLink.style.borderRadius = '50px';
            dupesLink.style.fontWeight = '600';
            dupesLink.style.transition = 'all 0.3s';
            dupesLink.textContent = 'Find Similar Products';
            dupesLink.onmouseover = function() { this.style.transform = 'translateY(-2px)'; };
            dupesLink.onmouseout = function() { this.style.transform = 'translateY(0)'; };

            dupesDiv.appendChild(dupesLink);
            container.appendChild(dupesDiv);

            {% if user.is_authenticated %}
            checkIfFavorite();
            {% endif %}

        } catch (error) {
            const container = document.getElementById('cosmetic-details');
            container.innerHTML = '';
            const p = document.createElement('p');
            p.textContent = 'Error loading cosmetic details.';
            container.appendChild(p);
        }
    }

    {% if user.is_authenticated %}
    let isFavorite = false;

    async function checkIfFavorite() {
        try {
            const response = await fetch('/api/preferences/my_favorites/');
            const favorites = await response.json();
            isFavorite = favorites.some(fav => fav.id == cosmeticId);
            updateFavoriteButton();
        } catch (error) {
            console.error('Error checking favorites');
        }
    }

    function updateFavoriteButton() {
        const btn = document.getElementById('favorite-btn');
        if (btn) {
            if (isFavorite) {
                btn.textContent = '★';
                btn.classList.add('favorited');
                btn.title = 'Remove from favorites';
            } else {
                btn.textContent = '☆';
                btn.classList.remove('favorited');
                btn.title = 'Add to favorites';
            }
        }
    }

    async function toggleFavorite() {
        try {
            const response = await fetch('/api/preferences/toggle_favorite/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({cosmetic_id: cosmeticId})
            });

            const data = await response.json();
            if (data.success) {
                isFavorite = data.is_favorite;
                updateFavoriteButton();
            }
        } catch (error) {
            alert('Error updating favorites');
        }
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    {% endif %}

    if (cosmeticId) {
        loadCosmeticDetails();
    } else {
        const container = document.getElementById('cosmetic-details');
        container.innerHTML = '';
        const p = document.createElement('p');
        p.textContent = 'Invalid cosmetic ID.';
        container.appendChild(p);
    }
    </script>

    <style>
    #ingredient-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1000;
    }

    .modal-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
    }

    .modal-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        border-radius: 20px;
        padding: 30px;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .modal-content h3 {
        color: var(--main-pink);
        font-size: 22px;
        margin-bottom: 10px;
    }

    .preference-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
    }

    .preference-btn {
        padding: 15px 20px;
        border: 3px solid;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        font-family: 'KineksRound', sans-serif;
        cursor: pointer;
        transition: all 0.3s;
        background: white;
    }

    .preference-btn.safe {
        border-color: var(--accent-green);
        color: #2d8659;
    }

    .preference-btn.safe:hover {
        background: rgba(113, 221, 153, 0.1);
        transform: scale(1.02);
    }

    .preference-btn.moderate {
        border-color: #f0ad4e;
        color: #d89736;
    }

    .preference-btn.moderate:hover {
        background: rgba(240, 173, 78, 0.1);
        transform: scale(1.02);
    }

    .preference-btn.unsafe {
        border-color: var(--accent-dark);
        color: var(--accent-dark);
    }

    .preference-btn.unsafe:hover {
        background: rgba(197, 78, 163, 0.1);
        transform: scale(1.02);
    }

    .cancel-btn {
        width: 100%;
        padding: 12px;
        background: #e0e0e0;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        font-family: 'KineksRound', sans-serif;
        cursor: pointer;
        transition: all 0.3s;
    }

    .cancel-btn:hover {
        background: #d0d0d0;
    }

    .ingredient-tag.clickable {
        cursor: pointer;
    }

    .ingredient-tag.clickable:hover {
        transform: scale(1.05);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    </style>
{% endblock %}
