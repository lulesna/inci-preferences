{% extends "base.html" %}

{% block title %}Cosmetic Details - INCI Preferences{% endblock %}

{% block content %}
    <section class="main-section">
        <div class="cosmetic-detail-container" id="cosmetic-details">
            <p>Loading cosmetic details...</p>
        </div>
    </section>

    {% if user.is_authenticated %}
    <div id="ingredient-modal" style="display: none;">
        <div class="modal-overlay" onclick="closeIngredientModal()"></div>
        <div class="modal-content">
            <h3 id="modal-ingredient-name"></h3>
            <p style="color: var(--text); margin-bottom: 20px;">Set your preference for this ingredient:</p>

            <div class="preference-buttons">
                <button class="preference-btn safe" onclick="setIngredientPreference('GREEN')">
                    ✅ Safe
                </button>
                <button class="preference-btn moderate" onclick="setIngredientPreference('YELLOW')">
                    ⚠️ Moderate
                </button>
                <button class="preference-btn unsafe" onclick="setIngredientPreference('RED')">
                    🚫 Unsafe
                </button>
            </div>

            <button class="cancel-btn" onclick="closeIngredientModal()">Cancel</button>
        </div>
    </div>
    {% endif %}

    <script>
    const cosmeticId = window.location.pathname.split('/').filter(Boolean).pop();
    let userPreferences = null;
    let selectedIngredient = null;

    async function loadUserPreferences() {
        {% if user.is_authenticated %}
        try {
            const response = await fetch('/api/preferences/my_preferences/');
            const data = await response.json();
            userPreferences = {
                safe: data.safe_ingredients.map(ing => ing.id),
                moderate: data.moderate_ingredients.map(ing => ing.id),
                unsafe: data.unsafe_ingredients.map(ing => ing.id)
            };
        } catch (error) {
            userPreferences = null;
        }
        {% endif %}
    }

    function getIngredientColor(ingredientId) {
        if (!userPreferences) return 'none';

        if (userPreferences.safe.includes(ingredientId)) return 'safe';
        if (userPreferences.moderate.includes(ingredientId)) return 'moderate';
        if (userPreferences.unsafe.includes(ingredientId)) return 'unsafe';
        return 'none';
    }

    function formatCategory(text) {
        if (!text) return '';
        return text.charAt(0) + text.slice(1).toLowerCase();
    }

    {% if user.is_authenticated %}
    function openIngredientModal(ingredientId, ingredientName) {
        selectedIngredient = ingredientId;
        document.getElementById('modal-ingredient-name').textContent = ingredientName;
        document.getElementById('ingredient-modal').style.display = 'block';
    }

    function closeIngredientModal() {
        document.getElementById('ingredient-modal').style.display = 'none';
        selectedIngredient = null;
    }

    async function setIngredientPreference(color) {
        if (!selectedIngredient) return;

        try {
            const response = await fetch('/api/preferences/set_ingredient_color/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    ingredient_id: selectedIngredient,
                    color: color
                })
            });

            if (response.ok) {
                closeIngredientModal();
                // Odśwież preferencje i kosmetyk
                await loadUserPreferences();
                await loadCosmeticDetails();
            } else {
                alert('Error setting preference');
            }
        } catch (error) {
            alert('Error setting preference');
        }
    }
    {% endif %}

    async function loadCosmeticDetails() {
        await loadUserPreferences();

        try {
            const response = await fetch(`/api/cosmetics/${cosmeticId}/`);
            const cosmetic = await response.json();

            let html = `
                <div class="cosmetic-detail-header">
                    <h2>${cosmetic.name}</h2>
                    {% if user.is_authenticated %}
                    <button id="favorite-btn" onclick="toggleFavorite()" title="Add to favorites">☆</button>
                    {% endif %}
                    <p><strong>Brand:</strong> ${cosmetic.brand}</p>
                    <p><strong>Category:</strong> ${formatCategory(cosmetic.main_category)}</p>
                    ${cosmetic.subcategory ? `<p><strong>Subcategory:</strong> ${formatCategory(cosmetic.subcategory)}</p>` : ''}
                    ${cosmetic.product_type ? `<p><strong>Product Type:</strong> ${formatCategory(cosmetic.product_type)}</p>` : ''}
                </div>

                <div class="ingredients-section">
                    <h3>Full Ingredients List (${cosmetic.ingredients.length})</h3>
            `;

            if (cosmetic.ingredients.length > 0) {
                html += '<div class="ingredients-list">';

                cosmetic.ingredients.forEach((ing, index) => {
                    const color = getIngredientColor(ing.id);

                    {% if user.is_authenticated %}
                    html += `<span class="ingredient-tag ${color} clickable"
                                   onclick="openIngredientModal(${ing.id}, '${ing.inci_name.replace(/'/g, "\\'")}')"
                                   title="Click to set preference">${ing.inci_name}</span>`;
                    {% else %}
                    html += `<span class="ingredient-tag ${color}" title="${ing.purpose || 'No purpose listed'}">${ing.inci_name}</span>`;
                    {% endif %}

                    if (index < cosmetic.ingredients.length - 1) {
                        html += ' ';
                    }
                });

                html += '</div>';

                {% if user.is_authenticated %}
                if (userPreferences) {
                    html += `<div class="ingredient-legend">
                        <span class="ingredient-tag safe">✅ Safe</span>
                        <span class="ingredient-tag moderate">⚠️ Moderate</span>
                        <span class="ingredient-tag unsafe">🚫 Unsafe</span>
                        <span style="color: var(--text); font-size: 12px;">based on your preferences - click ingredient to change</span>
                    </div>`;
                }
                {% endif %}

            } else {
                html += '<p>No ingredients listed.</p>';
            }

            html += '</div>';

            html += `
                <div style="text-align: center; margin-top: 30px;">
                    <a href="/dupes/?id=${cosmetic.id}" style="
                        display: inline-block;
                        padding: 12px 24px;
                        background-color: var(--main-pink);
                        color: white;
                        text-decoration: none;
                        border-radius: 50px;
                        font-weight: 600;
                        transition: all 0.3s;
                    " onmouseover="this.style.transform='translateY(-2px)'"
                       onmouseout="this.style.transform='translateY(0)'">
                        🔍 Find Similar Products
                    </a>
                </div>
            `;

            document.getElementById('cosmetic-details').innerHTML = html;

            {% if user.is_authenticated %}
            checkIfFavorite();
            {% endif %}

        } catch (error) {
            document.getElementById('cosmetic-details').innerHTML = '<p>Error loading cosmetic details.</p>';
        }
    }

    {% if user.is_authenticated %}
    let isFavorite = false;

    async function checkIfFavorite() {
        try {
            const response = await fetch('/api/preferences/my_favorites/');
            const favorites = await response.json();
            isFavorite = favorites.some(fav => fav.id == cosmeticId);
            updateFavoriteButton();
        } catch (error) {
            console.error('Error checking favorites');
        }
    }

    function updateFavoriteButton() {
        const btn = document.getElementById('favorite-btn');
        if (btn) {
            if (isFavorite) {
                btn.textContent = '☆';
                btn.style.backgroundColor = 'var(--main-pink)';
                btn.title = 'Remove from favorites';
            } else {
                btn.textContent = '☆';
                btn.style.backgroundColor = 'var(--lime)';
                btn.title = 'Add to favorites';
            }
        }
    }

    async function toggleFavorite() {
        try {
            const response = await fetch('/api/preferences/toggle_favorite/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({cosmetic_id: cosmeticId})
            });

            const data = await response.json();
            if (data.success) {
                isFavorite = data.is_favorite;
                updateFavoriteButton();
            }
        } catch (error) {
            alert('Error updating favorites');
        }
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    {% endif %}

    loadCosmeticDetails();
    </script>

    <style>
    #ingredient-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1000;
    }

    .modal-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
    }

    .modal-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        border-radius: 20px;
        padding: 30px;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .modal-content h3 {
        color: var(--main-pink);
        font-size: 22px;
        margin-bottom: 10px;
    }

    .preference-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
    }

    .preference-btn {
        padding: 15px 20px;
        border: 3px solid;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        font-family: 'KineksRound', sans-serif;
        cursor: pointer;
        transition: all 0.3s;
        background: white;
    }

    .preference-btn.safe {
        border-color: var(--accent-green);
        color: #2d8659;
    }

    .preference-btn.safe:hover {
        background: rgba(113, 221, 153, 0.1);
        transform: scale(1.02);
    }

    .preference-btn.moderate {
        border-color: #f0ad4e;
        color: #d89736;
    }

    .preference-btn.moderate:hover {
        background: rgba(240, 173, 78, 0.1);
        transform: scale(1.02);
    }

    .preference-btn.unsafe {
        border-color: var(--accent-dark);
        color: var(--accent-dark);
    }

    .preference-btn.unsafe:hover {
        background: rgba(197, 78, 163, 0.1);
        transform: scale(1.02);
    }

    .cancel-btn {
        width: 100%;
        padding: 12px;
        background: #e0e0e0;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        font-family: 'KineksRound', sans-serif;
        cursor: pointer;
        transition: all 0.3s;
    }

    .cancel-btn:hover {
        background: #d0d0d0;
    }

    .ingredient-tag.clickable {
        cursor: pointer;
    }

    .ingredient-tag.clickable:hover {
        transform: scale(1.05);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    </style>
{% endblock %}
