{% extends "base.html" %}

{% block title %}Search - INCI Preferences{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/search.css">
{% endblock %}

{% block content %}
    <section class="main-section">
        <h2>Search for cosmetics</h2>
            <div class="search-box">
                <input type="text" id="search-query" placeholder="Search by product name or brand..." maxlength="200" />
                <button id="search-btn" onclick="performSearch()">Search</button>
            </div>

            <div class="filters-section">
                <button class="toggle-filters-btn" onclick="toggleFilters()">
                    <span id="filter-icon">▼</span> Advanced Filters
                </button>

                <div id="filters-panel" style="display: none;">
                    <div class="filter-group">
                        <label>Category:</label>
                        <div class="filter-buttons">
                            <button class="filter-btn" data-filter="category" data-value="">All</button>
                            <button class="filter-btn" data-filter="category" data-value="FACE">Face</button>
                            <button class="filter-btn" data-filter="category" data-value="MAKEUP">Makeup</button>
                            <button class="filter-btn" data-filter="category" data-value="BODY">Body</button>
                            <button class="filter-btn" data-filter="category" data-value="HANDS">Hands</button>
                        </div>
                    </div>

                    <div class="filter-group" id="subcategory-group" style="display: none;">
                        <label>Subcategory:</label>
                        <div class="filter-buttons" id="subcategory-buttons"></div>
                    </div>

                    <div class="filter-group" id="product-type-group" style="display: none;">
                        <label>Product Type:</label>
                        <div class="filter-buttons" id="product-type-buttons"></div>
                    </div>

                    {% if user.is_authenticated %}

                    <div class="filter-group">
                        <label>Safety Level:</label>
                        <div class="filter-buttons">
                            <button class="filter-btn" data-filter="safety" data-value="">All</button>
                            <button class="filter-btn safe" data-filter="safety" data-value="safe">✅ Safe Only</button>
                            <button class="filter-btn moderate" data-filter="safety" data-value="moderate">⚠️ Moderate & Safe</button>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label>Must Contain Ingredient:</label>
                        <input type="text" id="ingredient-filter" placeholder="Start typing ingredient name..." maxlength="100" />
                        <div id="ingredient-suggestions"></div>
                        <div id="selected-ingredients"></div>
                    </div>

                    <div class="filter-group">
                        <label>Must NOT Contain:</label>
                        <input type="text" id="exclude-ingredient-filter" placeholder="Start typing ingredient name..." maxlength="100" />
                        <div id="exclude-ingredient-suggestions"></div>
                        <div id="excluded-ingredients"></div>
                    </div>
                    {% endif %}

                    <div class="filter-group">
                        <label>Sort By:</label>
                        <select id="sort-by">
                            <option value="name">Name (A-Z)</option>
                            <option value="name-desc">Name (Z-A)</option>
                            <option value="brand">Brand (A-Z)</option>
                            {% if user.is_authenticated %}
                            <option value="safety">Safety (Best First)</option>
                            <option value="ingredients">Most Safe Ingredients</option>
                            {% endif %}
                        </select>
                    </div>

                    <div class="filter-actions">
                        <button class="clear-filters-btn" onclick="clearFilters()">Clear All Filters</button>
                        <button class="apply-filters-btn" onclick="performSearch()">Apply Filters</button>
                    </div>
                </div>
            </div>

        <div id="active-filters" style="margin: 20px 0;"></div>

        <div id="search-results">
            <p style="text-align: center; color: var(--text);">Use the search box or filters to find cosmetics</p>
        </div>
    </section>

    <script>
    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('q') || '';

    let allIngredients = [];
    let selectedIngredients = [];
    let excludedIngredients = [];
    let userPreferences = null;

    const filters = {
        query: '',
        category: '',
        subcategory: '',
        productType: '',
        safety: '',
        sortBy: 'name'
    };

    const subcategoryMap = {
        'FACE': ['Cleanser', 'Moisturizer', 'Serum', 'Essence', 'Sunscreen'],
        'MAKEUP': ['Eyes', 'Face', 'Lips', 'Brows'],
        'BODY': [],
        'HANDS': []
    };

    const productTypeMap = {
        'Eyes': ['Mascara', 'Eyeshadow', 'Eyeliner'],
        'Face': ['Foundation', 'Concealer', 'Powder', 'Blush', 'Bronzer', 'Highlighter'],
        'Lips': ['Lipstick', 'Lip Gloss'],
        'Brows': ['Brow Pencil']
    };

    function formatCategory(text) {
        if (!text) return '';
        return text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
    }

    async function loadIngredients() {
        try {
            const response = await fetch('/api/ingredients/');
            allIngredients = await response.json();
        } catch (error) {
            console.error('Error loading ingredients');
        }
    }

    {% if user.is_authenticated %}
    async function loadUserPreferences() {
        try {
            const response = await fetch('/api/preferences/my_preferences/');
            const data = await response.json();
            userPreferences = {
                safe: data.safe_ingredients.map(ing => ing.id),
                moderate: data.moderate_ingredients.map(ing => ing.id),
                unsafe: data.unsafe_ingredients.map(ing => ing.id)
            };
        } catch (error) {
            userPreferences = null;
        }
    }

    function getSafetyClass(cosmetic) {
        if (!userPreferences) return '';

        const hasUnsafe = cosmetic.ingredients.some(ing =>
            userPreferences.unsafe.includes(ing.id)
        );
        if (hasUnsafe) return 'unsafe';

        const hasModerate = cosmetic.ingredients.some(ing =>
            userPreferences.moderate.includes(ing.id)
        );
        if (hasModerate) return 'moderate';

        return 'safe';
    }

    function getSafeIngredientCount(cosmetic) {
        if (!userPreferences) return 0;
        return cosmetic.ingredients.filter(ing =>
            userPreferences.safe.includes(ing.id)
        ).length;
    }
    {% endif %}

    function toggleFilters() {
        const panel = document.getElementById('filters-panel');
        const icon = document.getElementById('filter-icon');

        if (panel.style.display === 'none') {
            panel.style.display = 'block';
            icon.textContent = '▲';
        } else {
            panel.style.display = 'none';
            icon.textContent = '▼';
        }
    }

    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('filter-btn')) {
            const filterType = e.target.dataset.filter;
            const value = e.target.dataset.value;

            const group = e.target.parentElement;
            group.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));

            e.target.classList.add('active');

            if (filterType === 'category') {
                filters.category = value;
                filters.subcategory = '';
                filters.productType = '';
                updateSubcategoryButtons(value);
            } else if (filterType === 'subcategory') {
                filters.subcategory = value;
                filters.productType = '';
                updateProductTypeButtons(value);
            } else if (filterType === 'productType') {
                filters.productType = value;
            } else if (filterType === 'safety') {
                filters.safety = value;
            }

            updateActiveFilters();
        }
    });

    function updateSubcategoryButtons(category) {
        const group = document.getElementById('subcategory-group');
        const buttonsContainer = document.getElementById('subcategory-buttons');

        if (!category || !subcategoryMap[category] || subcategoryMap[category].length === 0) {
            group.style.display = 'none';
            return;
        }

        group.style.display = 'block';
        buttonsContainer.innerHTML = '';

        const allBtn = document.createElement('button');
        allBtn.className = 'filter-btn active';
        allBtn.dataset.filter = 'subcategory';
        allBtn.dataset.value = '';
        allBtn.textContent = 'All';
        buttonsContainer.appendChild(allBtn);

        subcategoryMap[category].forEach(sub => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.dataset.filter = 'subcategory';
            btn.dataset.value = sub;
            btn.textContent = sub;
            buttonsContainer.appendChild(btn);
        });

        document.getElementById('product-type-group').style.display = 'none';
    }

    function updateProductTypeButtons(subcategory) {
        const group = document.getElementById('product-type-group');
        const buttonsContainer = document.getElementById('product-type-buttons');

        if (!subcategory || !productTypeMap[subcategory] || productTypeMap[subcategory].length === 0) {
            group.style.display = 'none';
            return;
        }

        group.style.display = 'block';
        buttonsContainer.innerHTML = '';

        const allBtn = document.createElement('button');
        allBtn.className = 'filter-btn active';
        allBtn.dataset.filter = 'productType';
        allBtn.dataset.value = '';
        allBtn.textContent = 'All';
        buttonsContainer.appendChild(allBtn);

        productTypeMap[subcategory].forEach(type => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.dataset.filter = 'productType';
            btn.dataset.value = type;
            btn.textContent = type;
            buttonsContainer.appendChild(btn);
        });
    }

    document.getElementById('ingredient-filter')?.addEventListener('input', function(e) {
        const searchTerm = e.target.value.toLowerCase();
        const suggestionsContainer = document.getElementById('ingredient-suggestions');

        if (searchTerm.length < 2) {
            suggestionsContainer.innerHTML = '';
            return;
        }

        const matches = allIngredients.filter(ing =>
            ing.inci_name.toLowerCase().includes(searchTerm) &&
            !selectedIngredients.includes(ing.id)
        ).slice(0, 10);

        suggestionsContainer.innerHTML = '';

        if (matches.length > 0) {
            const listDiv = document.createElement('div');
            listDiv.className = 'suggestions-list';

            matches.forEach(ing => {
                const item = document.createElement('div');
                item.className = 'suggestion-item';
                item.textContent = ing.inci_name;
                item.onclick = () => addIngredientFilter(ing.id, ing.inci_name);
                listDiv.appendChild(item);
            });

            suggestionsContainer.appendChild(listDiv);
        }
    });

    document.getElementById('exclude-ingredient-filter')?.addEventListener('input', function(e) {
        const searchTerm = e.target.value.toLowerCase();
        const suggestionsContainer = document.getElementById('exclude-ingredient-suggestions');

        if (searchTerm.length < 2) {
            suggestionsContainer.innerHTML = '';
            return;
        }

        const matches = allIngredients.filter(ing =>
            ing.inci_name.toLowerCase().includes(searchTerm) &&
            !excludedIngredients.includes(ing.id)
        ).slice(0, 10);

        suggestionsContainer.innerHTML = '';

        if (matches.length > 0) {
            const listDiv = document.createElement('div');
            listDiv.className = 'suggestions-list';

            matches.forEach(ing => {
                const item = document.createElement('div');
                item.className = 'suggestion-item';
                item.textContent = ing.inci_name;
                item.onclick = () => addExcludeFilter(ing.id, ing.inci_name);
                listDiv.appendChild(item);
            });

            suggestionsContainer.appendChild(listDiv);
        }
    });

    function addIngredientFilter(id, name) {
        selectedIngredients.push(id);
        document.getElementById('ingredient-filter').value = '';
        document.getElementById('ingredient-suggestions').innerHTML = '';
        updateSelectedIngredients();
        updateActiveFilters();
    }

    function addExcludeFilter(id, name) {
        excludedIngredients.push(id);
        document.getElementById('exclude-ingredient-filter').value = '';
        document.getElementById('exclude-ingredient-suggestions').innerHTML = '';
        updateExcludedIngredients();
        updateActiveFilters();
    }

    function updateSelectedIngredients() {
        const container = document.getElementById('selected-ingredients');
        container.innerHTML = '';

        selectedIngredients.forEach(id => {
            const ing = allIngredients.find(i => i.id === id);
            if (ing) {
                const chip = document.createElement('span');
                chip.className = 'ingredient-chip';
                chip.textContent = ing.inci_name + ' ';

                const closeBtn = document.createElement('span');
                closeBtn.textContent = '×';
                closeBtn.style.cursor = 'pointer';
                closeBtn.onclick = () => removeIngredientFilter(id);

                chip.appendChild(closeBtn);
                container.appendChild(chip);
            }
        });
    }

    function updateExcludedIngredients() {
        const container = document.getElementById('excluded-ingredients');
        container.innerHTML = '';

        excludedIngredients.forEach(id => {
            const ing = allIngredients.find(i => i.id === id);
            if (ing) {
                const chip = document.createElement('span');
                chip.className = 'ingredient-chip exclude';
                chip.textContent = ing.inci_name + ' ';  // BEZPIECZNE

                const closeBtn = document.createElement('span');
                closeBtn.textContent = '×';
                closeBtn.style.cursor = 'pointer';
                closeBtn.onclick = () => removeExcludeFilter(id);

                chip.appendChild(closeBtn);
                container.appendChild(chip);
            }
        });
    }

    function removeIngredientFilter(id) {
        selectedIngredients = selectedIngredients.filter(i => i !== id);
        updateSelectedIngredients();
        updateActiveFilters();
        performSearch();
    }

    function removeExcludeFilter(id) {
        excludedIngredients = excludedIngredients.filter(i => i !== id);
        updateExcludedIngredients();
        updateActiveFilters();
        performSearch();
    }

    function updateActiveFilters() {
        const container = document.getElementById('active-filters');
        container.innerHTML = '';

        let chips = [];

        if (filters.query) chips.push(`Search: "${filters.query}"`);
        if (filters.category) chips.push(`Category: ${formatCategory(filters.category)}`);
        if (filters.subcategory) chips.push(`Subcategory: ${filters.subcategory}`);
        if (filters.productType) chips.push(`Type: ${filters.productType}`);
        if (filters.safety) chips.push(`Safety: ${filters.safety}`);
        if (selectedIngredients.length > 0) chips.push(`Contains: ${selectedIngredients.length} ingredient(s)`);
        if (excludedIngredients.length > 0) chips.push(`Excludes: ${excludedIngredients.length} ingredient(s)`);

        if (chips.length === 0) {
            return;
        }

        const chipsDiv = document.createElement('div');
        chipsDiv.className = 'active-filters-chips';

        chips.forEach(chip => {
            const chipSpan = document.createElement('span');
            chipSpan.className = 'filter-chip';
            chipSpan.textContent = chip;
            chipsDiv.appendChild(chipSpan);
        });

        container.appendChild(chipsDiv);
    }

    function clearFilters() {
        filters.query = '';
        filters.category = '';
        filters.subcategory = '';
        filters.productType = '';
        filters.safety = '';
        filters.sortBy = 'name';
        selectedIngredients = [];
        excludedIngredients = [];

        document.getElementById('search-query').value = '';
        document.getElementById('sort-by').value = 'name';

        if (document.getElementById('ingredient-filter')) {
            document.getElementById('ingredient-filter').value = '';
            document.getElementById('exclude-ingredient-filter').value = '';
        }

        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.filter-btn[data-value=""]').forEach(btn => btn.classList.add('active'));

        document.getElementById('subcategory-group').style.display = 'none';
        document.getElementById('product-type-group').style.display = 'none';

        updateSelectedIngredients();
        updateExcludedIngredients();
        updateActiveFilters();

        const resultsDiv = document.getElementById('search-results');
        resultsDiv.innerHTML = '';
        const p = document.createElement('p');
        p.style.textAlign = 'center';
        p.style.color = 'var(--text)';
        p.textContent = 'Use the search box or filters to find cosmetics';
        resultsDiv.appendChild(p);
    }

    async function performSearch() {
        filters.query = document.getElementById('search-query').value.trim();
        filters.sortBy = document.getElementById('sort-by').value;

        const resultsDiv = document.getElementById('search-results');
        resultsDiv.innerHTML = '';
        const loadingP = document.createElement('p');
        loadingP.textContent = 'Searching...';
        resultsDiv.appendChild(loadingP);

        try {
            let url = '/api/cosmetics/?';
            const params = [];

            if (filters.query) params.push(`search=${encodeURIComponent(filters.query)}`);
            if (filters.category) params.push(`main_category=${encodeURIComponent(filters.category)}`);
            if (filters.subcategory) params.push(`subcategory=${encodeURIComponent(filters.subcategory)}`);

            url += params.join('&');

            const response = await fetch(url);
            let cosmetics = await response.json();

            if (filters.productType) {
                cosmetics = cosmetics.filter(c => c.product_type === filters.productType);
            }

            if (selectedIngredients.length > 0) {
                cosmetics = cosmetics.filter(c => {
                    const cosmeticIngredients = c.ingredients.map(ing => ing.id);
                    return selectedIngredients.every(id => cosmeticIngredients.includes(id));
                });
            }

            if (excludedIngredients.length > 0) {
                cosmetics = cosmetics.filter(c => {
                    const cosmeticIngredients = c.ingredients.map(ing => ing.id);
                    return !excludedIngredients.some(id => cosmeticIngredients.includes(id));
                });
            }

            {% if user.is_authenticated %}
            if (filters.safety === 'safe') {
                cosmetics = cosmetics.filter(c => getSafetyClass(c) === 'safe');
            } else if (filters.safety === 'moderate') {
                cosmetics = cosmetics.filter(c => {
                    const safety = getSafetyClass(c);
                    return safety === 'safe' || safety === 'moderate';
                });
            }

            if (filters.sortBy === 'safety') {
                cosmetics.sort((a, b) => {
                    const orderMap = { 'safe': 0, 'moderate': 1, 'unsafe': 2 };
                    return orderMap[getSafetyClass(a)] - orderMap[getSafetyClass(b)];
                });
            } else if (filters.sortBy === 'ingredients') {
                cosmetics.sort((a, b) => getSafeIngredientCount(b) - getSafeIngredientCount(a));
            }
            {% endif %}

            if (filters.sortBy === 'name') {
                cosmetics.sort((a, b) => a.name.localeCompare(b.name));
            } else if (filters.sortBy === 'name-desc') {
                cosmetics.sort((a, b) => b.name.localeCompare(a.name));
            } else if (filters.sortBy === 'brand') {
                cosmetics.sort((a, b) => a.brand.localeCompare(b.brand));
            }

            resultsDiv.innerHTML = '';

            if (cosmetics.length === 0) {
                const p = document.createElement('p');
                p.style.textAlign = 'center';
                p.style.color = 'var(--text)';
                p.style.fontSize = '16px';
                p.textContent = 'No cosmetics found. Try adjusting your filters.';
                resultsDiv.appendChild(p);
                return;
            }

            const heading = document.createElement('h3');
            heading.textContent = `Found ${cosmetics.length} product${cosmetics.length !== 1 ? 's' : ''}`;
            resultsDiv.appendChild(heading);

            const cosmeticsContainer = document.createElement('div');
            cosmeticsContainer.id = 'cosmetics-container';
            resultsDiv.appendChild(cosmeticsContainer);

            await displayCosmeticsWithSafety(cosmetics, 'cosmetics-container');

        } catch (error) {
            resultsDiv.innerHTML = '';
            const p = document.createElement('p');
            p.style.textAlign = 'center';
            p.style.color = 'var(--accent-dark)';
            p.textContent = 'Error searching cosmetics. Please try again.';
            resultsDiv.appendChild(p);
        }
    }

    async function displayCosmeticsWithSafety(cosmetics, containerId) {
        const container = document.getElementById(containerId);

        {% if user.is_authenticated %}
        function getSafetyBadge(safetyClass) {
            if (safetyClass === 'unsafe') return '<span class="safety-badge">🚫</span>';
            if (safetyClass === 'moderate') return '<span class="safety-badge">⚠️</span>';
            if (safetyClass === 'safe') return '<span class="safety-badge">✅</span>';
            return '';
        }
        {% endif %}

        let html = '<div class="cosmetics-grid">';

        cosmetics.forEach(cosmetic => {
            let cardSafetyClass = '';
            let cardBadge = '';

            {% if user.is_authenticated %}
            cardSafetyClass = getSafetyClass(cosmetic);
            cardBadge = getSafetyBadge(cardSafetyClass);
            {% endif %}

            const escapedName = escapeHtml(cosmetic.name);
            const escapedBrand = escapeHtml(cosmetic.brand);
            const displayType = escapeHtml(formatCategory(cosmetic.product_type || cosmetic.subcategory || ''));
            const displayCategory = escapeHtml(formatCategory(cosmetic.main_category));

            const cosmeticId = typeof cosmetic.id === 'number' ? cosmetic.id : 0;
            const ingredientsCount = Array.isArray(cosmetic.ingredients) ? cosmetic.ingredients.length : 0;

            html += `
                <div class="cosmetic-result-card ${cardSafetyClass}">
                    ${cardBadge}
                    <div class="card-content">
                        <h3>${escapedName}</h3>
                        <p><strong>Brand:</strong> ${escapedBrand}</p>
                        <p><strong>Category:</strong> ${displayCategory}</p>
                        ${displayType ? `<p><strong>Type:</strong> ${displayType}</p>` : ''}
                        <p><strong>Ingredients:</strong> ${ingredientsCount}</p>
                    </div>
                    <a href="/cosmetic/${cosmeticId}/">View Details</a>
                </div>
            `;
        });

        html += '</div>';
        container.innerHTML = html;
    }

    document.getElementById('search-query').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            performSearch();
        }
    });

    document.getElementById('sort-by').addEventListener('change', function() {
        if (filters.query || filters.category || selectedIngredients.length > 0) {
            performSearch();
        }
    });

    loadIngredients();
    {% if user.is_authenticated %}
    loadUserPreferences();
    {% endif %}

    document.querySelectorAll('.filter-btn[data-value=""]').forEach(btn => btn.classList.add('active'));

    if (initialQuery) {
        document.getElementById('search-query').value = initialQuery;
        setTimeout(() => {
            performSearch();
        }, 500);
    }
    </script>

{% endblock %}
