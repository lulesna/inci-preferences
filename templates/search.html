{% extends "base.html" %}

{% block title %}Search - INCI Preferences{% endblock %}

{% block content %}
    <section class="main-section">
        <h2>Search for cosmetics</h2>

        <form id="search-form" class="search-page-form">
            <div>
                <label for="search-query">Search by name or brand:</label>
                <input type="text" id="search-query" name="q" placeholder="Enter product name or brand..." value="{{ request.GET.q }}" required>
            </div>

            <div>
                <label for="category-filter">Filter by category:</label>
                <select id="category-filter" name="category">
                    <option value="">All Categories</option>
                    <option value="FACE">Skincare</option>
                    <option value="MAKEUP">Makeup</option>
                    <option value="BODY">Body</option>
                </select>
            </div>

            <button type="submit">Search</button>
        </form>

        <div id="search-results">
        </div>
    </section>

    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const queryFromUrl = urlParams.get('q');

    if (queryFromUrl) {
        document.getElementById('search-query').value = queryFromUrl;
        performSearch(queryFromUrl);
    }

    document.getElementById('search-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const query = document.getElementById('search-query').value;
        const category = document.getElementById('category-filter').value;

        performSearch(query, category);
    });

    async function displayCosmeticsWithSafety(cosmetics, containerId) {
        const container = document.getElementById(containerId);

        if (cosmetics.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: var(--text);">No cosmetics found.</p>';
            return;
        }

        {% if user.is_authenticated %}
        let userPreferences = null;
        try {
            const prefResponse = await fetch('/api/preferences/my_preferences/');
            const prefData = await prefResponse.json();
            userPreferences = {
                safe: prefData.safe_ingredients.map(ing => ing.id),
                moderate: prefData.moderate_ingredients.map(ing => ing.id),
                unsafe: prefData.unsafe_ingredients.map(ing => ing.id)
            };
        } catch (error) {
            userPreferences = null;
        }

        function getSafetyClass(cosmetic) {
            if (!userPreferences) return '';

            const hasUnsafe = cosmetic.ingredients.some(ing =>
                userPreferences.unsafe.includes(ing.id)
            );

            if (hasUnsafe) return 'unsafe';

            const hasModerate = cosmetic.ingredients.some(ing =>
                userPreferences.moderate.includes(ing.id)
            );

            if (hasModerate) return 'moderate';

            return 'safe';
        }

        function getSafetyBadge(safetyClass) {
            if (safetyClass === 'unsafe') {
                return '<span class="safety-badge">🚫</span>';
            } else if (safetyClass === 'moderate') {
                return '<span class="safety-badge">⚠️</span>';
            } else if (safetyClass === 'safe') {
                return '<span class="safety-badge">✅</span>';
            }
            return '';
        }
        {% endif %}

        function formatCategory(category) {
            return category.charAt(0) + category.slice(1).toLowerCase();
        }

        let html = '<div class="cosmetics-grid">';

        cosmetics.forEach(cosmetic => {
            {% if user.is_authenticated %}
            const safetyClass = getSafetyClass(cosmetic);
            const safetyBadge = getSafetyBadge(safetyClass);
            {% else %}
            const safetyClass = '';
            const safetyBadge = '';
            {% endif %}

            const displayType = cosmetic.product_type || cosmetic.subcategory || '';
            const displayCategory = formatCategory(cosmetic.main_category);

            html += `
                <div class="cosmetic-result-card ${safetyClass}">
                    ${safetyBadge}
                    <div class="card-content">
                        <h3>${cosmetic.name}</h3>
                        <p><strong>Brand:</strong> ${cosmetic.brand}</p>
                        <p><strong>Category:</strong> ${displayCategory}</p>
                        ${displayType ? `<p><strong>Type:</strong> ${displayType}</p>` : ''}
                        <p><strong>Ingredients:</strong> ${cosmetic.ingredients.length}</p>
                    </div>
                    <a href="/cosmetic/${cosmetic.id}/">View Details</a>
                </div>
            `;
        });

        html += '</div>';
        container.innerHTML = html;
    }

    async function performSearch(query, category = '') {
        const resultsDiv = document.getElementById('search-results');
        resultsDiv.innerHTML = '<p>Searching...</p>';

        try {
            let url = `/api/cosmetics/?search=${encodeURIComponent(query)}`;
            if (category) {
                url += `&main_category=${category}`;
            }

            const response = await fetch(url);
            const cosmetics = await response.json();

            if (cosmetics.length === 0) {
                resultsDiv.innerHTML = '<p style="text-align: center; color: var(--text); font-size: 16px;">No cosmetics found matching your search.</p>';
                return;
            }

            resultsDiv.innerHTML = '<h3>Search Results (' + cosmetics.length + '):</h3><div id="cosmetics-container"></div>';
            await displayCosmeticsWithSafety(cosmetics, 'cosmetics-container');

        } catch (error) {
            resultsDiv.innerHTML = '<p style="text-align: center; color: var(--accent-dark);">Error searching cosmetics. Please try again.</p>';
        }
    }

    async function viewQuickDetails(cosmeticId) {
        const detailsDiv = document.getElementById('details-' + cosmeticId);
        
        if (detailsDiv.style.display === 'block') {
            detailsDiv.style.display = 'none';
            return;
        }
        
        detailsDiv.innerHTML = '<p>Loading ingredients...</p>';
        detailsDiv.style.display = 'block';
        
        try {
            const response = await fetch(`/api/cosmetics/${cosmeticId}/`);
            const cosmetic = await response.json();
            
            let html = '<h4>Ingredients:</h4><ul>';
            cosmetic.ingredients.forEach(ing => {
                html += `<li>${ing.inci_name}${ing.purpose ? ' - ' + ing.purpose : ''}</li>`;
            });
            html += '</ul>';
            
            detailsDiv.innerHTML = html;
        } catch (error) {
            detailsDiv.innerHTML = '<p>Error loading details</p>';
        }
    }
    </script>
{% endblock %}
