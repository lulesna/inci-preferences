{% extends "base.html" %}
{% load static %}

{% block title %}Makeup - INCI Preferences{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/categories.css' %}">
{% endblock %}

{% block content %}
    <section class="main-section">
        <h2>Makeup</h2>

        <div class="categories-container">
            <a href="{% url 'makeup_face' %}" class="category-card">
                <div class="category-card-circle">
                    <img src="{% static 'images/makeup-face.png' %}" alt="Face">
                </div>
                <p>Face</p>
            </a>

            <a href="{% url 'makeup_eyes' %}" class="category-card">
                <div class="category-card-circle">
                    <img src="{% static 'images/makeup-eyes.png' %}" alt="Eyes">
                </div>
                <p>Eyes</p>
            </a>

            <a href="{% url 'makeup_lips' %}" class="category-card">
                <div class="category-card-circle">
                    <img src="{% static 'images/makeup-lips.png' %}" alt="Lips">
                </div>
                <p>Lips</p>
            </a>
        </div>

        <h3 class="section-title">All Makeup Products</h3>
        <div id="cosmetics-list">
            <p>Loading cosmetics...</p>
        </div>
    </section>

    <script>
    async function displayCosmeticsWithSafety(cosmetics, containerId) {
        const container = document.getElementById(containerId);

        if (cosmetics.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: var(--text);">No cosmetics found.</p>';
            return;
        }

        {% if user.is_authenticated %}
        let userPreferences = null;
        try {
            const prefResponse = await fetch('/api/preferences/my_preferences/');
            const prefData = await prefResponse.json();
            userPreferences = {
                safe: prefData.safe_ingredients.map(ing => ing.id),
                moderate: prefData.moderate_ingredients.map(ing => ing.id),
                unsafe: prefData.unsafe_ingredients.map(ing => ing.id)
            };
        } catch (error) {
            userPreferences = null;
        }

        function getSafetyClass(cosmetic) {
            if (!userPreferences) return '';

            const hasUnsafe = cosmetic.ingredients.some(ing =>
                userPreferences.unsafe.includes(ing.id)
            );

            if (hasUnsafe) return 'unsafe';

            const hasModerate = cosmetic.ingredients.some(ing =>
                userPreferences.moderate.includes(ing.id)
            );

            if (hasModerate) return 'moderate';

            return 'safe';
        }

        function getSafetyBadge(safetyClass) {
            if (safetyClass === 'unsafe') {
                return '<span class="safety-badge">🚫</span>';
            } else if (safetyClass === 'moderate') {
                return '<span class="safety-badge">⚠️</span>';
            } else if (safetyClass === 'safe') {
                return '<span class="safety-badge">✅</span>';
            }
            return '';
        }
        {% endif %}

        let html = '<div class="cosmetics-grid">';

        cosmetics.forEach(cosmetic => {
            {% if user.is_authenticated %}
            const safetyClass = getSafetyClass(cosmetic);
            const safetyBadge = getSafetyBadge(safetyClass);
            {% else %}
            const safetyClass = '';
            const safetyBadge = '';
            {% endif %}

            const displayType = cosmetic.product_type || cosmetic.subcategory || cosmetic.main_category;

            html += `
                <div class="cosmetic-result-card ${safetyClass}">
                    ${safetyBadge}
                    <h3>${cosmetic.name}</h3>
                    <p><strong>Brand:</strong> ${cosmetic.brand}</p>
                    ${displayType ? `<p><strong>Type:</strong> ${displayType}</p>` : ''}
                    <p><strong>Ingredients:</strong> ${cosmetic.ingredients.length}</p>
                    <a href="/cosmetic/${cosmetic.id}/">View Details</a>
                </div>
            `;
        });

        html += '</div>';
        container.innerHTML = html;
    }

    let allCosmetics = [];
    let visibleCount = 18;
    const perLoad = 18;

    async function loadCosmetics() {
        try {
            const response = await fetch('/api/cosmetics/?main_category=FACE');
            allCosmetics = await response.json();
            visibleCount = perLoad;
            showCosmetics();
        } catch (error) {
            document.getElementById('cosmetics-list').innerHTML = '<p>Error loading cosmetics</p>';
        }
    }

    function showCosmetics() {
        const toShow = allCosmetics.slice(0, visibleCount);
        displayCosmeticsWithSafety(toShow, 'cosmetics-list');

        let existing = document.getElementById('load-more-container');
        if (existing) existing.remove();

        if (visibleCount < allCosmetics.length) {
            const remaining = allCosmetics.length - visibleCount;
            const html = `
                <div id="load-more-container" class="load-more-container">
                    <button class="load-more-btn" onclick="loadMore()">
                        Show more
                    </button>
                </div>
            `;
            document.getElementById('cosmetics-list').insertAdjacentHTML('afterend', html);
        }
    }

    function loadMore() {
        visibleCount += perLoad;
        showCosmetics();
    }

    loadCosmetics();
    </script>
{% endblock %}
