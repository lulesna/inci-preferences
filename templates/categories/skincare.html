{% extends "base.html" %}
{% load static %}

{% block title %}Skincare - INCI Preferences{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/categories.css' %}">
{% endblock %}

{% block content %}
    <section class="main-section">
        <h2>Skincare</h2>

        <div class="categories-container">
            <a href="{% url 'skincare_cleanser' %}" class="category-card">
                <p>Cleanser</p>
            </a>

            <a href="{% url 'skincare_moisturizer' %}" class="category-card">
                <p>Moisturizer</p>
            </a>

            <a href="{% url 'skincare_sunscreen' %}" class="category-card">
                <p>Sunscreen</p>
            </a>

            <a href="{% url 'skincare_serum' %}" class="category-card">
                <p>Serum</p>
            </a>

            <a href="{% url 'skincare_toner' %}" class="category-card">
                <p>Toner</p>
            </a>
        </div>

        <h3>All Skincare Products:</h3>
        <div id="cosmetics-list">
            <p>Loading cosmetics...</p>
        </div>
    </section>

    <script>
    async function loadCosmetics() {
        try {
            const response = await fetch('/api/cosmetics/?main_category=FACE');
            const cosmetics = await response.json();

            const container = document.getElementById('cosmetics-list');

            if (cosmetics.length === 0) {
                container.innerHTML = '<p>No skincare products found.</p>';
                return;
            }

            let html = '<div>';
            cosmetics.forEach(cosmetic => {
                html += `
                    <div style="border: 1px solid #ccc; padding: 10px; margin: 10px 0;">
                        <h3>${cosmetic.name}</h3>
                        <p><strong>Brand:</strong> ${cosmetic.brand}</p>
                        <p><strong>Type:</strong> ${cosmetic.subcategory || 'N/A'}</p>
                        <p><strong>Ingredients:</strong> ${cosmetic.ingredients.length}</p>
                        <a href="/cosmetic/${cosmetic.id}/">View Details</a>
                    </div>
                `;
            });
            html += '</div>';

            container.innerHTML = html;
        } catch (error) {
            document.getElementById('cosmetics-list').innerHTML = '<p>Error loading cosmetics</p>';
        }
    }

    loadCosmetics();
    </script>
{% endblock %}
