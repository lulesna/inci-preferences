{% extends "base.html" %}
{% load static %}

{% block title %}Face Makeup - INCI Preferences{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/categories.css' %}">
{% endblock %}

{% block content %}
    <section class="main-section">
        <h2>Makeup - Face</h2>

        <div id="cosmetics-list">
            <p>Loading cosmetics...</p>
        </div>
    </section>

    <script>
    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }

    async function displayCosmeticsWithSafety(cosmetics, containerId) {
        const container = document.getElementById(containerId);

        if (cosmetics.length === 0) {
            container.innerHTML = '';
            const p = document.createElement('p');
            p.style.textAlign = 'center';
            p.style.color = 'var(--text)';
            p.textContent = 'No cosmetics found.';
            container.appendChild(p);
            return;
        }

        {% if user.is_authenticated %}
        let userPreferences = null;
        try {
            const prefResponse = await fetch('/api/preferences/my_preferences/');
            const prefData = await prefResponse.json();
            userPreferences = {
                safe: prefData.safe_ingredients.map(ing => ing.id),
                moderate: prefData.moderate_ingredients.map(ing => ing.id),
                unsafe: prefData.unsafe_ingredients.map(ing => ing.id)
            };
        } catch (error) {
            userPreferences = null;
        }

        function getSafetyClass(cosmetic) {
            if (!userPreferences) return '';

            const hasUnsafe = cosmetic.ingredients.some(ing =>
                userPreferences.unsafe.includes(ing.id)
            );

            if (hasUnsafe) return 'unsafe';

            const hasModerate = cosmetic.ingredients.some(ing =>
                userPreferences.moderate.includes(ing.id)
            );

            if (hasModerate) return 'moderate';

            return 'safe';
        }

        function getSafetyBadge(safetyClass) {
            if (safetyClass === 'unsafe') {
                return '<span class="safety-badge">🚫</span>';
            } else if (safetyClass === 'moderate') {
                return '<span class="safety-badge">⚠️</span>';
            } else if (safetyClass === 'safe') {
                return '<span class="safety-badge">✅</span>';
            }
            return '';
        }
        {% endif %}

        let html = '<div class="cosmetics-grid">';

        cosmetics.forEach(cosmetic => {
            let cardSafetyClass = '';
            let cardBadge = '';

            {% if user.is_authenticated %}
            cardSafetyClass = getSafetyClass(cosmetic);
            cardBadge = getSafetyBadge(cardSafetyClass);
            {% endif %}

            const escapedName = escapeHtml(cosmetic.name);
            const escapedBrand = escapeHtml(cosmetic.brand);
            const displayType = escapeHtml(cosmetic.product_type || cosmetic.subcategory || cosmetic.main_category);

            const cosmeticId = typeof cosmetic.id === 'number' ? cosmetic.id : 0;
            const ingredientsCount = Array.isArray(cosmetic.ingredients) ? cosmetic.ingredients.length : 0;

            html += `
                <div class="cosmetic-result-card ${cardSafetyClass}">
                    ${cardBadge}
                    <h3>${escapedName}</h3>
                    <p><strong>Brand:</strong> ${escapedBrand}</p>
                    ${displayType ? `<p><strong>Type:</strong> ${displayType}</p>` : ''}
                    <p><strong>Ingredients:</strong> ${ingredientsCount}</p>
                    <a href="/cosmetic/${cosmeticId}/">View Details</a>
                </div>
            `;
        });

        html += '</div>';
        container.innerHTML = html;
    }

    async function loadCosmetics() {
        try {
            const response = await fetch('/api/cosmetics/?main_category=MAKEUP&subcategory=Face');
            const cosmetics = await response.json();

            await displayCosmeticsWithSafety(cosmetics, 'cosmetics-list');
        } catch (error) {
            const container = document.getElementById('cosmetics-list');
            container.innerHTML = '';
            const p = document.createElement('p');
            p.textContent = 'Error loading cosmetics';
            container.appendChild(p);
        }
    }

    loadCosmetics();
    </script>
{% endblock %}
